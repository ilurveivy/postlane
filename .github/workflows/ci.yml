name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # better-sqlite3 ships prebuilt binaries; skipping scripts avoids a needless
      # native compile and keeps the job fast and deterministic.
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: postlane:ci
      - name: smoke test the image
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name postlane-ci \
            -e POSTLANE_MODE=verify \
            -e DATA_DIR=/data \
            -v "$RUNNER_TEMP/data:/data" \
            -p 4173:4173 postlane:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ready >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173/ready
          curl -fsS http://127.0.0.1:4173/health_check
          docker logs postlane-ci
          docker rm -f postlane-ci
