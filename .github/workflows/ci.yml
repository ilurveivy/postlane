name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # better-sqlite3 ships prebuilt binaries; skipping scripts avoids a needless
      # native compile and keeps the job fast and deterministic.
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: postlane:ci
      # The image runs as the non-root `node` user, so /data must be a named volume
      # (it inherits the image's ownership). A host bind mount would be owned by the
      # runner user and the container could not create the SQLite file or secret key.
      - name: smoke test the image
        run: |
          set -uo pipefail
          docker run -d --name postlane-ci \
            -e DATA_DIR=/data \
            -v postlane-ci-data:/data \
            -p 4173:4173 postlane:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          status=0
          curl -fsS http://127.0.0.1:4173/ready || status=1
          curl -fsS http://127.0.0.1:4173/health_check || status=1
          # Always dump the container log, and mirror it into the job summary: without it
          # a red step says nothing about why the process never became ready.
          logs="$(docker logs postlane-ci 2>&1 | tail -n 80 || true)"
          echo '--- container log ---'
          echo "$logs"
          state="$(docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}}' postlane-ci 2>&1 || true)"
          echo "--- container state: $state ---"
          {
            echo ''
            echo '### container state'
            echo ''
            echo '```'
            echo "$state"
            echo '```'
            echo ''
            echo '### container log (tail)'
            echo ''
            echo '```'
            echo "$logs"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker rm -f postlane-ci >/dev/null || true
          docker volume rm postlane-ci-data >/dev/null || true
          if [ "$status" -ne 0 ]; then
            # Belt and braces: workflow logs require authentication to download, while
            # annotations do not. Emitting the tail as base64 annotations keeps a red
            # build diagnosable from outside the browser.
            printf '%s' "$logs" | base64 -w0 | fold -w 3000 | while read -r part; do
              echo "::error::POSTLANE_LOG:${part}"
            done
          fi
          exit $status
